name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/fred-edwin/prosper-hotel

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute image tag
        id: tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          push: true
          tags: ${{ env.IMAGE }}-migrate:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE,GITHUB_SHA,SENTRY_DSN
          script: |
            set -euo pipefail
            cd /home/deploy/prosper-hotel

            export APP_IMAGE="${IMAGE}:${GITHUB_SHA}"
            {
              echo "APP_IMAGE=${APP_IMAGE}"
              echo "SENTRY_DSN=${SENTRY_DSN}"
            } > .env.deploy

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull "${APP_IMAGE}"
            docker pull "${IMAGE}-migrate:${GITHUB_SHA}"

            set -a; source .env; source .env.deploy; set +a
            docker run --rm --network prosper-hotel_default \
              -e DATABASE_URL="postgresql://prosper:${POSTGRES_PASSWORD}@postgres:5432/prosper_hotel" \
              "${IMAGE}-migrate:${GITHUB_SHA}" \
              pnpm exec prisma migrate deploy

            docker compose --env-file .env --env-file .env.deploy \
              -f docker-compose.prod.yml up -d --no-deps app

            docker image prune -f
