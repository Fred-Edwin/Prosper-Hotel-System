services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prosper
      POSTGRES_PASSWORD: prosper
      POSTGRES_DB: prosper_hotel
    ports:
      - "5432:5432"
    volumes:
      - prosper_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prosper -d prosper_hotel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  prosper_pgdata:
