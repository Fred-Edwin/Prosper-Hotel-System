<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prosper Hotel · Module architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 640px;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Prosper Hotel</p>
    <h1>Six modules, one rule</h1>
    <p class="subtitle">Cross-module access only through a module's <code>index.ts</code> — never its <code>queries.ts</code> or <code>logic.ts</code> directly.</p>

    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="modulearch-title modulearch-desc">
      <title id="modulearch-title">Prosper Hotel module architecture</title>
      <desc id="modulearch-desc">Six modules — catalogue, stock, sales, cash, reporting, and people — where stock depends on catalogue, reporting reads from all five other modules but owns no data of its own, and people underlies every module by enforcing location-scoped permissions.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone: business modules -->
      <rect x="40" y="164" width="928" height="180" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="428" y="168" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="504" y="177" fill="rgba(45,49,66,0.55)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">BUSINESS MODULES</text>

      <!-- ===== Arrows (drawn before nodes) ===== -->

      <!-- reporting -> catalogue (dashed read, angled to the left) -->
      <path d="M 420,120 V 176 Q 420,184 412,184 H 172 Q 164,184 164,192 V 220"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- reporting -> stock -->
      <path d="M 460,120 V 220" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- reporting -> sales -->
      <path d="M 540,120 V 220" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- reporting -> cash (angled to the right) -->
      <path d="M 580,120 V 176 Q 580,184 588,184 H 756 Q 764,184 764,192 V 220"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- reporting -> people (angled, far right, dashed transit over the zone footer) -->
      <path d="M 632,88 H 900 Q 908,88 908,96 V 220"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- stock -> catalogue (solid, real dependency, accent — the primary integration point) -->
      <path d="M 364,284 V 316 Q 364,324 356,324 H 172 Q 164,324 164,316 V 284"
            fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- people footer -> all five (dashed, permission checks) -->
      <path d="M 108,392 V 384 Q 108,376 116,376 H 160 V 344" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M 320,392 V 344" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M 520,392 V 344" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M 720,392 V 344" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M 908,392 V 384 Q 908,376 900,376 H 856 V 344" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow label: reads -->
      <rect x="662" y="140" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="688" y="149" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READS</text>

      <!-- Arrow label: needs a product -->
      <rect x="236" y="300" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="264" y="309" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEEDS PROD</text>

      <!-- Arrow label: permission check -->
      <rect x="486" y="364" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="520" y="373" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CAN ACCESS?</text>

      <!-- ===== Node: reporting (top, focal — spans full width conceptually, drawn as wide node) ===== -->
      <rect x="368" y="56" width="264" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="368" y="56" width="264" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="376" y="64" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="396" y="73" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READ-ONLY</text>
      <text x="500" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">reporting</text>
      <text x="500" y="108" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">profit · valuation · audit trail</text>

      <!-- Node: catalogue -->
      <rect x="80" y="220" width="168" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="220" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="164" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">catalogue</text>
      <text x="164" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">products · recipes</text>

      <!-- Node: stock -->
      <rect x="280" y="220" width="168" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="220" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="364" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">stock</text>
      <text x="364" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">movements · counts</text>

      <!-- Node: sales -->
      <rect x="480" y="220" width="168" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="480" y="220" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="564" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">sales</text>
      <text x="564" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sales · credit</text>

      <!-- Node: cash -->
      <rect x="680" y="220" width="168" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="220" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="764" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">cash</text>
      <text x="764" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">handovers · balance</text>

      <!-- Node: people (footer bar, spans width) -->
      <rect x="80" y="392" width="848" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="392" width="848" height="52" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="96" y="400" width="40" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="116" y="409" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTH</text>
      <text x="504" y="422" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">people</text>
      <text x="504" y="437" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">staff · roles · canAccessLocation() underlies every module above</text>

      <!-- Legend -->
      <line x1="40" y1="486" x2="960" y2="486" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="502" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="140" y1="498" x2="172" y2="498" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="180" y="502" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Real dependency (via index.ts)</text>

      <line x1="420" y1="498" x2="452" y2="498" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="460" y="502" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Read-only (reporting / auth check)</text>

      <rect x="700" y="490" width="16" height="16" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="724" y="502" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Owns no data of its own</text>
    </svg>
  </div>
</body>
</html>
